name: Test

on:
  push:
    paths:
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm test
